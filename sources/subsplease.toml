# SubsPlease's "latest releases" API. Validated against a live response from
# https://subsplease.org/api/?f=latest&tz=Africa/Casablanca — see
# crates/fetch/tests/fixtures/subsplease_latest.json for a captured sample
# and docs/sources.md for the plugin file format itself.
#
# The response is a JSON *object* keyed by "<show> - <episode>" strings, so
# `items = ".[]"` iterates its values. Downloads are magnet-only, so
# `fields.variant.method` is a constant. `image_url`/`page` are relative and
# absent on some entries, so `cover`/`id` use `prefix` and no `default`
# (left unset when missing, which is fine — both are optional fields).

id = "subsplease"
endpoint = "https://subsplease.org/api/"
method = "GET"
interval = "10m"
query = { f = "latest", tz = "Africa/Casablanca" }
# The small app/source badge shown on every notification from this source
# (distinct from `fields.cover`'s per-show cover art, which is the big
# content image) — see docs/notifications.md.
icon = "https://subsplease.org/favicon.ico"

items = ".[]"
variants = ".downloads[]"

[fields]
series   = { path = ".show" }
episode  = { path = ".episode", default = "?" }
cover    = { path = ".image_url", prefix = "https://subsplease.org" }
show_url = { path = ".page", prefix = "https://subsplease.org/shows/", suffix = "/" }
id       = { path = ".page" }

[fields.variant]
# Raw values are bare digits ("480"/"720"/"1080") already, but the regex
# normalizes any source that includes a "p" suffix to the same convention.
resolution = { path = ".res", regex = "(\\d+)", default = "480" }
method     = { default = "magnet" }
link       = { path = ".magnet" }

# SubsPlease occasionally posts a "batch" release bundling a whole cour
# into one download once it's finished airing, e.g. episode "01-22"
# instead of a single episode number — signalled only by `episode` being a
# range, there's no dedicated flag in the API. Skipped by default
# (ignore's own default); set `ignore = false` here to get notified about
# batches too.
[batch]
regex = "^\\d+\\s*-\\s*\\d+$"
